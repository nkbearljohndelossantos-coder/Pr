# Nginx Server Configuration for NKB Manufacturing Purchase Requisition ERP
# Domain: pr.nkbmanufacturing.com

upstream node_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server - Auto Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pr.nkbmanufacturing.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Primary Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pr.nkbmanufacturing.com;

    # SSL Certificate Paths (Let's Encrypt / Certbot Standard)
    ssl_certificate /etc/letsencrypt/live/pr.nkbmanufacturing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pr.nkbmanufacturing.com/privkey.pem;

    # Modern SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Favicon Location
    location = /favicon.ico {
        root /var/www/enterprise-erp/frontend/dist;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /favicon.svg {
        root /var/www/enterprise-erp/frontend/dist;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Frontend Single Page Application (SPA)
    location / {
        root /var/www/enterprise-erp/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache Static Assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Backend Express REST API Proxy
    location /api/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # File Uploads Directory
    location /uploads/ {
        alias /var/www/enterprise-erp/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom 502 / 503 Error Pages
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
