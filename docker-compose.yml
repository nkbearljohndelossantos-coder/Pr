version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nkb_erp_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=enterprise_erp_jwt_secret_key_2026_safe_32_bytes
      - JWT_REFRESH_SECRET=enterprise_erp_jwt_refresh_secret_key_2026
      - JWT_EXPIRES_IN=3650d
      - JWT_REFRESH_EXPIRES_IN=3650d
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-u335953510_Request}
      - DB_PASS=${DB_PASS:-NkbManufacturing2025}
      - DB_NAME=${DB_NAME:-u335953510_pr_data}
      - DB_TYPE=mysql
      - COMPANY_NAME=NKB Manufacturing
      - COMPANY_CODE=NKB
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/src/data:/app/src/data
      - ./backend/backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - erp_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nkb_erp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - erp_net

networks:
  erp_net:
    driver: bridge

volumes:
  erp_uploads:
  erp_data:
