version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=enterprise_erp_production_jwt_secret_key_2026_super_secure
      - COMPANY_NAME=Enterprise Global Industries Inc.
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  erp_data:
  erp_uploads:
